[project]
name = 'anysearch-py'
version = '0.1.0'
description = 'Typed Python client for AnySearch.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
authors = [
    { name = 'WH-2099', email = 'wh2099@pm.me' }
]
requires-python = '>=3.14'
dependencies = [
    'pydantic>=2.12',
    'urllib3-future>=2.12.910',
]


[project.urls]
source = 'https://github.com/WH-2099/anysearch-py'
homepage = 'https://github.com/WH-2099/anysearch-py'
issues = 'https://github.com/WH-2099/anysearch-py/issues'

[dependency-groups]
dev = [
    'pytest',
    'pytest-cov',
    'pytest-mock',
    'ruff',
    'prek',
    'ty',
]

[build-system]
requires = ['uv_build~=0.11']
build-backend = 'uv_build'

[tool.uv]
default-groups = ['dev']

[tool.ruff]
fix = true
preview = true
required-version = '>=0.15'
extend-exclude = ['anysearch-skill']

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'COM812',  # Conflicts with `ruff format`.
    'ERA001',  # False positives are common.
    'TC',      # Runtime use of typing constructs is common now.
    'CPY',     # Covered by the standalone LICENSE file.
    'PLR0913', # Explicit is better than implicit.
    'PLR0917', # Complex is better than complicated.
    'PLR6301', # Violates the usual practice.
    'D',       # Too verbose.
    'FBT',     # Too strict.
    'TID252',  # Too absolute.
    'ANN401',  # We hope to enforce this, but typing is still evolving.
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'S101',    # Assert statements used for pytest.
    'PLR2004', # Magic value used in test cases.
    'PLC2701', # Allow import private members from graphon module.
    'PLC1901', # be more precise about assertion in tests.

    # permit calls of private methods until we separate
    # public interface tests from implementation tests.
    'SLF001', # allow calls of private class methods in tests
]

[tool.ty.environment]
python-platform = 'linux'

[tool.pytest]
minversion = '9.0'
testpaths = ['tests']
