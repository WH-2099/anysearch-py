[project]
name = 'anysearch-py'
version = '0.2.0'
description = 'Typed Python client for AnySearch.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
authors = [
    { name = 'WH-2099', email = 'wh2099@pm.me' }
]
requires-python = '>=3.14'
dependencies = [
    'pydantic>=2.12',
    'urllib3-future>=2.12.910',
]


[project.urls]
source = 'https://github.com/WH-2099/anysearch-py'
homepage = 'https://github.com/WH-2099/anysearch-py'
issues = 'https://github.com/WH-2099/anysearch-py/issues'

[dependency-groups]
dev = [
    'pytest',
    'ruff',
    'prek',
    'ty',
]

[build-system]
requires = ['uv_build~=0.12']
build-backend = 'uv_build'

[tool.uv]
default-groups = ['dev']

[tool.ruff]
fix = true
preview = true
required-version = '>=0.15'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'missing-trailing-comma',  # Conflicts with `ruff format`.
    'commented-out-code',  # False positives are common.
    'TC',      # Runtime use of typing constructs is common now.
    'CPY',     # Covered by the standalone LICENSE file.
    'too-many-arguments', # Explicit is better than implicit.
    'too-many-positional-arguments', # Complex is better than complicated.
    'no-self-use', # Violates the usual practice.
    'D',       # Too verbose.
    'FBT',     # Too strict.
    'relative-imports',  # Too absolute.
    'any-type',  # We hope to enforce this, but typing is still evolving.
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'assert',    # Assert statements used for pytest.
    'magic-value-comparison', # Magic value used in test cases.
    'compare-to-empty-string', # be more precise about assertion in tests.
]

[tool.ty.environment]
python-platform = 'linux'

[tool.pytest]
minversion = '9.0'
testpaths = ['tests']
